<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="../img/chess.png" alt="Chess Logo" />
        </div>
        <h2>Sign Up for CHESSMATES</h2>
        <p id="errorMessage" class="error-message"></p>

        <form id="signupForm" method="POST" action="/signup">
            <input type="hidden" name="next" id="next">
            <div class="input-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required minlength="3" maxlength="30"
                       pattern="[A-Za-z0-9_.\-]+" title="Letters, numbers, dots, dashes or underscores"
                       placeholder="Enter your username">
            </div>
            <div class="input-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required minlength="6" placeholder="Create a password (6+ characters)">
            </div>
            <div class="input-group">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password">
            </div>
            <input type="submit" id="signupButton" value="Sign Up">
        </form>
        <p class="login-link">Already have an account? <a id="signinLink" href="../signin/">Login</a></p>
    </div>

    <script>
        // The server sends failed sign-ups back here as ?error=...&username=...&email=...
        const params = new URLSearchParams(location.search);
        document.getElementById("errorMessage").textContent = params.get("error") || "";
        document.getElementById("username").value = params.get("username") || "";
        document.getElementById("email").value = params.get("email") || "";

        const next = params.get("next");
        if (next) {
            document.getElementById("next").value = next;
            document.getElementById("signinLink").href = "../signin/?next=" + encodeURIComponent(next);
        }

        document.getElementById("signupForm").addEventListener("submit", function (event) {
            if (document.getElementById("password").value !== document.getElementById("confirmPassword").value) {
                event.preventDefault();
                document.getElementById("errorMessage").textContent = "Passwords do not match.";
            }
        });
    </script>
</body>
</html>
